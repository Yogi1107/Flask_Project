<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Member</title>

    <!-- Local Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center text-primary mb-4">Edit Member</h1>

      <div class="card shadow mx-auto" style="max-width: 500px">
        <div class="card-body">
          <form
            method="POST"
            action="{{ url_for('edit_member', member_id=member.member_id) }}"
          >
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                value="{{ member.name }}"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ member.email }}"
                required
              />
            </div>

            <button type="submit" class="btn btn-success w-100">
              Update Member
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.js') }}"></script>
  </body>
</html>
