<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrow Book</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center text-primary mb-4">Borrow Book</h1>
      <div class="card mx-auto shadow" style="max-width: 500px; padding: 20px">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Select Book</label>
            <select class="form-select" name="book_id" required>
              {% for book in books %}
              <option value="{{ book.book_id }}">
                {{ book.title }} ({{ book.available_copies }} available)
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Select Member</label>
            <select class="form-select" name="member_id" required>
              {% for member in members %}
              <option value="{{ member.member_id }}">{{ member.name }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-success w-100">Borrow</button>
        </form>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.js') }}"></script>
  </body>
</html>
